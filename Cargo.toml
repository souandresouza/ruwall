[package]
name = "ruwall"
version = "3.3.1"
edition = "2021"
description = "Generate and change color-schemes on the fly (Rust port of pywal)"
license = "MIT"
keywords = ["wal", "colorscheme", "terminal", "wallpaper"]
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
rand = "0.8"
include_dir = "0.7"
regex = "1"

[[bin]]
name = "ruwall"
path = "src/main.rs"